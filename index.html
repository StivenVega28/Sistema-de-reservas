<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesero | Sistema de Reservas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="index">
  <header class="navbar">
    <div class="navbar__brand">Solo Sena</div>
    <nav class="navbar__nav">
      <a href="index.html" class="navbar__link" data-page="index">Mesero</a>
      <a href="cocina.html" class="navbar__link" data-page="cocina">Cocina</a>
      <a href="despacho.html" class="navbar__link" data-page="despacho">Despacho</a>
      <a href="admin.html" class="navbar__link" data-page="admin">Admin</a>
      <a href="reservas.html" class="navbar__link" data-page="reservas">Reservas</a>
    </nav>
    <div class="navbar__session">
      <span id="navbar-usuario" class="navbar__usuario"></span>
      <button id="btn-logout" class="btn btn--sm btn--outline" type="button">Salir</button>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Reserva de mesas y pedidos</h1>

    <section class="two-col">
      <div>
        <h2 class="page-title" style="font-size:1.1rem;">Mesas disponibles</h2>
        <div id="mesas-grid" class="mesas-grid"></div>

        <h2 class="page-title" style="font-size:1.1rem; margin-top:1.5rem;">Mesas ocupadas</h2>
        <div id="mesas-ocupadas" class="mesas-grid"></div>
      </div>

      <div>
        <h2 id="titulo-pedido" class="page-title" style="font-size:1.1rem;">Nuevo pedido</h2>
        <form id="form-pedido">
          <div class="form-group">
            <label class="form-label" for="select-mesero">Mesero</label>
            <select id="select-mesero" class="form-control" required></select>
          </div>

          <div class="form-group">
            <label class="form-label" for="fecha-reserva">Fecha y hora de reserva</label>
            <input type="datetime-local" id="fecha-reserva" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label">Platos</label>
            <div id="platos-list" class="platos-list"></div>
          </div>

          <div class="form-group">
            <strong>Subtotal: </strong>
            <span id="subtotal-preview">$0</span>
          </div>

          <button type="submit" class="btn btn--block" id="btn-crear-pedido" disabled>
            Confirmar pedido
          </button>

          <button type="button" id="btn-liberar-mesa" class="btn btn--danger btn--block"
            style="display:none; margin-top:0.75rem;">
            Liberar mesa
          </button>
        </form>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/views/mesero.js"></script>
</body>

</html>
